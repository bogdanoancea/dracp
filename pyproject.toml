[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dracp"
version = "0.2.0"
description = "Dynamic Regime-Aware Conformal Prediction: distribution-free prediction intervals under multiple distribution shifts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bogdan Oancea", email = "bogdan.oancea@gmail.com" }]
maintainers = [{ name = "Bogdan Oancea", email = "bogdan.oancea@gmail.com" }]
keywords = [
  "conformal prediction", "uncertainty quantification", "prediction intervals",
  "distribution shift", "concept drift", "time series", "forecasting",
  "econometrics", "machine learning",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
experiments = ["matplotlib>=3.7", "requests>=2.31", "PyYAML>=6.0", "joblib>=1.3"]
dev = ["pytest>=7.0", "build", "twine"]

[project.urls]
Homepage = "https://github.com/bogdanoancea/dracp"
Repository = "https://github.com/bogdanoancea/dracp"
Issues = "https://github.com/bogdanoancea/dracp/issues"
Archive = "https://doi.org/10.5281/zenodo.21675706"

[tool.setuptools.packages.find]
where = ["."]
include = ["dracp*"]
exclude = ["data*", "results*", "configs*", "tests*", "experiments*", "real_data*", "reporting*", "synthetic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
