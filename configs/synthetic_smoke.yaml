seed: 42
alpha: 0.10
n_samples: 700
n_features: 4
train_fraction: 0.45
calibration_fraction: 0.25
output_dir: results/synthetic_smoke
scenarios: [stationary, combined_shift]
model:
  max_iter: 50
  learning_rate: 0.08
dracp:
  calibration_window: 120
  target_window: 30
  temporal_decay: 0.99
  bandwidth: 2.0
  adaptive_bandwidth: true
  bandwidth_grid: [1.0, 2.0, 4.0]
  min_ess: 15
  max_weight: 0.35
  ratio_clip_min: 0.1
  ratio_clip_max: 10.0
  n_regimes: 2
  regime_beta: 1.0
  alpha_step: 0.02
  fallback: global
ablations: []
